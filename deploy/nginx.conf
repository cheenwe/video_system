# lab_system 反向代理示例（大文件上传 / 视频 Range 播放）
# 将下方 upstream 与 server_name 按实际环境修改后，include 到 Nginx 站点配置。

upstream lab_system_app {
    server 127.0.0.1:8808;
    keepalive 32;
}

server {
    listen 80;
    server_name lab.example.com;

    # 与 .env VIDEO_MAX_UPLOAD_MB 对齐（默认 5120MB）
    client_max_body_size 5120m;
    client_body_timeout 3600s;

    location / {
        proxy_pass http://lab_system_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 视频断点续传 / 分片上传
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ---------- HLS 切片（弱网优化） ----------
    # .ts 是内容寻址文件（文件名不变、内容不变），且 URL 已带鉴权参数，
    # 因此在边缘缓存可显著降低源站压力与弱网下的重复请求。
    # 隐私视频不会因此泄露：缓存键包含完整 URL（含 token），
    # 只有拿到同一 token 的请求才会命中；应用侧同样返回 private 缓存头。
    location ~ ^/api/videos/\d+/hls/.+\.ts$ {
        proxy_pass http://lab_system_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 切片可长缓存；playlist 保持每次回源校验（见下方）
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        proxy_cache_use_stale updating timeout;
        add_header Cache-Control "private, max-age=86400, immutable";
        proxy_ignore_headers Cache-Control;
    }

    # playlist 会被应用改写并可能变化，不缓存
    location ~ ^/api/videos/\d+/hls/.+\.m3u8$ {
        proxy_pass http://lab_system_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        add_header Cache-Control "private, max-age=60, must-revalidate";
        proxy_ignore_headers Cache-Control;
    }
}
